<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GSAP Motion Lab — a playground for building and practicing web animations with GSAP, React, Vite, and Tailwind CSS."
    />
    <meta name="author" content="Dev Team" />
    <meta name="theme-color" content="#deecfd" />
    <title>GSAP Motion Lab</title>
    <!--
      Fonts are self-hosted in public/fonts/ and declared in src/index.css.
      Only the two faces used above the fold are preloaded: a font is otherwise
      discovered late, once the CSS has parsed. Keep these paths in step with
      the @font-face rules — a preload nothing uses is a wasted download.
    -->
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/gabarito-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
